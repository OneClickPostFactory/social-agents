name: Read OCPF build-trigger access
on:
  push:
    branches: [ops/ocpf-release-access-20260929]
    paths: ['.github/workflows/inspect-ocpf-build-access.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'OneClickPostFactory/social-agents' && github.ref == 'refs/heads/ops/ocpf-release-access-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only the two OCPF trigger lists; never export credentials or bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const token = process.env.CLOUDFLARE_API_TOKEN, account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const report = { read_only: true, observed_at: new Date().toISOString(), workers: {}, errors: [] };
          const names = ['oneclickpostfactory', 'oneclickpostfactory-agent'];
          async function get(path, label) {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/${path}`, { method: 'GET', redirect: 'error', headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(15000) });
              if (!response.ok) { await response.body?.cancel(); report.errors.push(`${label}_http_${response.status}`); return null; }
              const reader = response.body.getReader(); const chunks = []; let size = 0;
              try { for (;;) { const { value, done } = await reader.read(); if (done) break; size += value.length; if (size > 2097152) throw new Error('oversize'); chunks.push(Buffer.from(value)); } }
              finally { await reader.cancel().catch(() => {}); reader.releaseLock(); }
              const body = JSON.parse(Buffer.concat(chunks).toString());
              if (body.success !== true) throw new Error('invalid');
              return body;
            } catch { report.errors.push(`${label}_unverified`); return null; }
          }
          if (!token || !/^[a-f0-9]{32}$/i.test(account || '')) report.errors.push('credential_configuration_missing');
          else {
            const inventory = await get('workers/scripts', 'inventory');
            for (const name of names) {
              const row = inventory?.result?.find(v => v.id === name);
              if (!/^[a-f0-9-]{24,64}$/i.test(row?.tag || '')) { report.errors.push(`${name}_tag_unverified`); continue; }
              const body = await get(`builds/workers/${row.tag}/triggers`, name);
              report.workers[name] = { observed: Array.isArray(body?.result), count: Array.isArray(body?.result) ? body.result.length : null };
              if (Array.isArray(body?.result)) report.workers[name].triggers = body.result.map(v => ({
                deleted: typeof v.deleted_on === 'string',
                main_included: Array.isArray(v.branch_includes) ? v.branch_includes.some(b => b === 'main' || b === '*') : null,
                main_excluded: Array.isArray(v.branch_excludes) ? v.branch_excludes.some(b => b === 'main' || b === '*') : null,
                deploys_worker: typeof v.deploy_command === 'string' ? /wrangler\s+deploy/.test(v.deploy_command) : null,
                command_sha256: typeof v.deploy_command === 'string' ? createHash('sha256').update(v.deploy_command).digest('hex') : null,
              }));
            }
          }
          console.log(JSON.stringify(report));
          process.exitCode = report.errors.length ? 2 : 0;
          NODE
