name: Inspect database access presence
on:
  push:
    branches: [ops/ocpf-release-access-20260929]
    paths: ['.github/workflows/inspect-db-access-presence.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'OneClickPostFactory/social-agents' && github.ref == 'refs/heads/ops/ocpf-release-access-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report configured names only, never secret values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const names=['SUPABASE_ACCESS_TOKEN','SUPABASE_DB_URL','SUPABASE_DB_PASSWORD','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SECRET_KEY'];
          console.log(JSON.stringify({read_only:true,network_requests:0,configured:Object.fromEntries(names.map(k=>[k,Boolean(process.env[k])]))}));
          NODE
