name = "oneclickpostfactory-agent"
main = "src/cloudflare-worker.ts"
compatibility_date = "2026-05-07"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/1 * * * *"]

[vars]
NODE_ENV = "production"
SUPABASE_WORKER_BATCH_SIZE = "5"
DAILY_INVENTORY_PLANNER_ENABLED = "true"
DAILY_INVENTORY_PLANNER_START_LOCAL_DATE = "2026-07-14"
HTTP_TIMEOUT_MS = "45000"
OPENAI_IMAGE_MODEL = "gpt-image-2"
OPENAI_IMAGE_TIMEOUT_MS = "120000"
CLOUDINARY_FOLDER = "social-agent/instagram"
COLLECTOR_INGEST_ENABLED = "false"
COLLECTOR_INGEST_WRITE_ENABLED = "false"
COLLECTOR_INGEST_ENV = "production"
REDDIT_CONNECTOR_ENABLED = "true"
REDDIT_CONNECTOR_MAX_POSTS_PER_RUN = "2"
REDDIT_CONNECTOR_PAIRING_TTL_SECONDS = "600"
APP_ALLOWED_ORIGINS = "https://www.oneclickpostfactory.com,https://oneclickpostfactory.woeinvests.workers.dev,https://oneclickwebsitefactory.tailwaggingwebdesign.com"

[env.collector_staging]
name = "oneclickpostfactory-agent-collector-staging"

[env.collector_staging.triggers]
crons = []

[env.collector_staging.vars]
NODE_ENV = "staging"
SUPABASE_WORKER_BATCH_SIZE = "5"
HTTP_TIMEOUT_MS = "45000"
OPENAI_IMAGE_MODEL = "gpt-image-2"
OPENAI_IMAGE_TIMEOUT_MS = "120000"
CLOUDINARY_FOLDER = "social-agent/instagram"
COLLECTOR_INGEST_ENABLED = "true"
COLLECTOR_INGEST_WRITE_ENABLED = "true"
COLLECTOR_INGEST_ENV = "staging"
COLLECTOR_INGEST_MAX_RECORDS = "2"
